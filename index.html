<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security Headers (Meta representation) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://*; img-src 'self' data: https://*; media-src 'self' data: https://*; font-src 'self' data: https://*;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- SEO Enterprise & Branding -->
    <title>Koffmann Capital Group | KCG Executive Intelligence</title>
    <meta name="description" content="Koffmann Capital Group est un fonds d'investissement stratégique opérant au carrefour de la haute technologie et de l'intelligence économique en Afrique et à l'international." />
    <meta name="keywords" content="Koffmann Capital Group, KCG, Venture Capital, Intelligence Artificielle, Private Equity, Afrique, Investissement" />
    <meta name="theme-color" content="#C8102E" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.koffmann.group/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.koffmann.group/" />
    <meta property="og:title" content="Koffmann Capital Group | KCG" />
    <meta property="og:description" content="L'écosystème technologique et financier souverain." />
    <meta property="og:image" content="https://www.koffmann.group/og-image.jpg" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Koffmann Capital Group" />
    <meta name="twitter:description" content="L'écosystème technologique et financier souverain." />
    <meta name="twitter:image" content="https://www.koffmann.group/og-image.jpg" />

    <!-- Icons & Manifest -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Koffmann Capital Group",
      "url": "https://www.koffmann.group",
      "logo": "https://www.koffmann.group/logo.png",
      "description": "Fonds d'investissement stratégique et d'intelligence économique.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Investor Relations",
        "email": "contact@koffmann.group"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
